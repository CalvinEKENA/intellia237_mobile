name: intellia237
description: "Application e-learning Intellia 237."
publish_to: "none"
version: 3.2.1+29

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^17.1.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.4

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.1.3
  cloud_functions: ^6.0.2
  firebase_storage: ^13.1.0
  firebase_app_check: ^0.4.7
  firebase_messaging: ^16.1.1

  # Dictée et lecture à voix haute : tout se fait sur l'appareil. Aucun audio
  # n'est téléversé, ni pour transcrire, ni pour lire une réponse.
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  image_picker: ^1.1.2
  image_picker_android: ^0.8.13+14
  image_picker_platform_interface: ^2.11.1

  flutter_animate: ^4.5.0
  animations: ^2.0.11
  confetti: ^0.8.0
  flutter_native_splash: ^2.4.6
  package_info_plus: ^10.2.0
  firebase_analytics: ^12.4.5
  firebase_crashlytics: ^5.2.6
  connectivity_plus: ^7.3.0
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  just_audio: ^0.10.6
  file_picker: ^12.2.0
  video_player: 2.14.0
  visibility_detector: 0.4.0+2
  url_launcher: ^6.3.1

  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/BarlowCondensed-Black.ttf
          weight: 900
    - family: CampaignBody
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800

  assets:
    - assets/fonts/
    - assets/branding/
    - assets/companions/

# Icône de lancement uniquement. Les plateformes non mobiles restent hors de
# ce mécanisme : leurs ressources déjà versionnées, dont le favicon web, ne
# doivent pas être régénérées par cette configuration.
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
  image_path: assets/branding/icone.png
  min_sdk_android: 21
  # Le visuel validé est posé sur une carte quasi blanche : le fond adaptatif
  # reprend exactement sa teinte dominante pour ne créer aucune bordure.
  adaptive_icon_background: "#FEFEFE"
  # Variante technique dérivée, jamais un redessin : le logo est détouré de sa
  # carte puis remis à l'échelle pour tenir entièrement dans la zone qu'Android
  # garantit visible sous tous les masques. Sans elle, « INTELLIA 237 » est
  # rogné par le masque circulaire.
  adaptive_icon_foreground: assets/branding/icone_adaptive_foreground.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  # iOS interdit l'alpha : tout aplatissement se fait sur le fond du visuel.
  background_color_ios: "#FEFEFE"

# Splash natif — couche A. Couleur de fond identique au premier frame du
# Le splash natif ne montre plus rien : il tient seulement le papier de
# l'onboarding pendant que le moteur démarre. Le nom s'écrit ensuite côté
# Flutter, lettre après lettre. Toute image ici réintroduirait le logo.
flutter_native_splash:
  color: "#F4EFE5"
  android: true
  ios: true
  web: true
  android_12:
    color: "#F4EFE5"
