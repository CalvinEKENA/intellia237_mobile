name: intellia237
description: "Application e-learning Intellia 237."
publish_to: "none"
version: 3.2.1+38

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^17.1.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.4
  # Content Engine : intégrité des packs distants et cache persistant.
  crypto: ^3.0.7
  path_provider: ^2.1.5

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.1.3
  cloud_functions: ^6.0.2
  firebase_storage: ^13.1.0
  firebase_app_check: ^0.4.7
  firebase_messaging: ^16.1.1

  image_picker: ^1.1.2
  image_picker_android: ^0.8.13+14
  image_picker_platform_interface: ^2.11.1

  flutter_animate: ^4.5.0
  animations: ^2.0.11
  confetti: ^0.8.0
  flutter_native_splash: ^2.4.6
  package_info_plus: ^10.2.0
  firebase_analytics: ^12.4.5
  firebase_crashlytics: ^5.2.6
  connectivity_plus: ^7.3.0
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  just_audio: ^0.10.6
  file_picker: ^12.2.0
  video_player: 2.14.0
  visibility_detector: 0.4.0+2
  url_launcher: ^6.3.1

  intl: any
  google_sign_in: ^7.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/BarlowCondensed-Black.ttf
          weight: 900
    - family: CampaignBody
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800

  assets:
    - assets/fonts/
    - assets/branding/
    - assets/branding/google/
    - assets/companions/
    - assets/companions/dialogue/
    # Packs pédagogiques locaux (Content Engine) : un dossier par chapitre.
    # Un test vérifie que chaque pack présent ici est bien déclaré.
    - assets/content/terminale_d/mathematiques/ch01_arithmetique/
    - assets/content/terminale_d/mathematiques/ch02_nombres_complexes/
    - assets/content/terminale_d/mathematiques/ch03_fonctions_numeriques/
    - assets/content/terminale/anglais/m1_u1_applying_for_a_passport/
    - assets/content/terminale/anglais/m1_u2_discussing_recreational_activities/
    - assets/content/terminale_cd/physique/m1_s1_erreurs_et_incertitudes/
    - assets/content/terminale_cd/physique/m1_s2_dimension_d_une_grandeur_physique/
    # Catalogue de référence des établissements (généré par
    # tool/establishments/import_master_catalog.dart).
    - assets/data/establishments/

# Icône de lancement uniquement. Les plateformes non mobiles restent hors de
# ce mécanisme : leurs ressources déjà versionnées, dont le favicon web, ne
# doivent pas être régénérées par cette configuration.
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
  image_path: assets/branding/icone.png
  min_sdk_android: 21
  # Icône adaptative : deux dérivées techniques, jamais un redessin
  # (tool/branding/derive_launcher_assets.py). icone.png est exactement
  # logo.png posé sur un dégradé mint → pervenche :
  # - le fond reprend ce dégradé, posé sur les 72 dp visibles ;
  # - le premier plan est le wordmark de logo.png, réduit pour tenir dans le
  #   cercle de 66 dp qu'Android garantit sous tous les masques. Sans lui,
  #   « INTELLIA237 », qui occupe 90 % de la largeur, serait rogné.
  adaptive_icon_background: assets/branding/icone_adaptive_background.png
  adaptive_icon_foreground: assets/branding/icone_adaptive_foreground.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  # icone.png est opaque (RVB) : aucun aplatissement n'a lieu ; la couleur
  # de secours reprend le médian du dégradé.
  background_color_ios: "#B0DCEB"

# Splash natif : une couleur unie, rien d'autre. C'est exactement la
# surface de la première image Flutter (BrandLaunchPalette.surface), où le
# logo se révèle ensuite. Sur Android 12+, le système montre l'icône de
# l'application au centre : icône → surface claire → wordmark.
# L'application reste en thème clair : même couleur en mode sombre.
flutter_native_splash:
  color: "#F2F9FC"
  color_dark: "#F2F9FC"
  android: true
  ios: true
  # Le web a sa propre page de chargement (web/index.html) : le générateur
  # n'y injecte pas un second écran.
  web: false
  android_12:
    color: "#F2F9FC"
    color_dark: "#F2F9FC"
