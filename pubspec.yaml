name: intellia237
description: "Application e-learning Intellia 237."
publish_to: "none"
version: 3.0.0+22

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^17.1.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.4

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.1.3
  cloud_functions: ^6.0.2
  firebase_storage: ^13.1.0
  firebase_app_check: ^0.4.7

  image_picker: ^1.1.2
  image_picker_android: ^0.8.13+14
  image_picker_platform_interface: ^2.11.1

  flutter_animate: ^4.5.0
  animations: ^2.0.11
  confetti: ^0.8.0
  flutter_native_splash: ^2.4.6
  package_info_plus: ^10.2.0
  firebase_analytics: ^12.4.5
  firebase_crashlytics: ^5.2.6
  connectivity_plus: ^7.3.0
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/branding/
    - assets/companions/

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/branding/icone.png
    background_color: "#041025"
    theme_color: "#071B3D"
  windows:
    generate: true
    image_path: assets/branding/icone.png
  macos:
    generate: true
    image_path: assets/branding/icone.png
  image_path: assets/branding/icone.png
  min_sdk_android: 21
  adaptive_icon_background: "#041025"
  adaptive_icon_foreground: assets/branding/icone.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  background_color_ios: "#041025"

# Splash natif — couche A. Couleur de fond identique au premier frame du
# splash Flutter (web : #FAFAFD) pour éliminer toute frame blanche au cold start.
# Logo officiel INTELLIA237 (jamais un ancien logo hérité).
flutter_native_splash:
  color: "#FAFAFD"
  image: assets/branding/identity_master.png
  android: true
  ios: true
  web: true
  android_12:
    color: "#FAFAFD"
    image: assets/branding/icone.png
