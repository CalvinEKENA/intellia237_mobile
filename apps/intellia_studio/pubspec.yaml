name: intellia_studio
description: "INTELLIA Studio — Windows Administration Console for INTELLIA237"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^17.1.0
  google_fonts: ^6.2.1
  http: ^1.3.0
  intl: any
  shared_preferences: ^2.5.4
  crypto: ^3.0.6
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/

dependency_overrides:
  shared_preferences_foundation: 2.5.6
  path_provider_foundation: 2.5.1
