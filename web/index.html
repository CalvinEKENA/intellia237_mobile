<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    Base de l'application. Remplacée par la valeur de `--base-href` au build.
    Pour savoir.intellia237.com (racine du domaine), elle vaut "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="INTELLIA 237 : tes cours, tes quiz, ton parcours et tes compagnons Kira et Léo, dans ton navigateur.">
  <meta name="theme-color" content="#F4EFE5">

  <!-- Écran d'accueil (Android, iPhone) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="INTELLIA 237">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>INTELLIA 237</title>
  <link rel="manifest" href="manifest.json">

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">

  <style>
    /* Page d'attente : affichée pendant le premier chargement, retirée dès la
       première image de l'application. Sans dépendance extérieure. */
    @font-face {
      font-family: "IntelliaWordmark";
      src: url("assets/assets/fonts/BarlowCondensed-ExtraBold.ttf") format("truetype");
      font-display: swap;
    }
    html, body {
      height: 100%;
      margin: 0;
      background: #F4EFE5;
    }
    #intellia-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #F4EFE5;
      color: #25233E;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity 360ms ease;
    }
    #intellia-loader.done {
      opacity: 0;
      pointer-events: none;
    }
    .wordmark {
      font-family: "IntelliaWordmark", "Arial Narrow", sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: 1px;
      line-height: 1;
    }
    .wordmark .d2 { color: #007A5E; }
    .wordmark .d3 { color: #CE1126; }
    .wordmark .d7 { color: #E3A81C; }
    .ink {
      width: 120px;
      height: 4px;
      border-radius: 2px;
      background: rgba(37, 35, 62, 0.10);
      overflow: hidden;
    }
    .ink::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background: #5444D8;
      animation: ink 1.4s ease-in-out infinite;
    }
    @keyframes ink {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(260%); }
    }
    .hint {
      font-size: 13px;
      color: #656173;
      max-width: 260px;
      text-align: center;
      line-height: 1.45;
    }
    @media (prefers-reduced-motion: reduce) {
      .ink::after { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="intellia-loader" role="status" aria-live="polite">
    <div class="wordmark" aria-label="INTELLIA 237">
      INTELLIA <span class="d2">2</span><span class="d3">3</span><span class="d7">7</span>
    </div>
    <div class="ink" aria-hidden="true"></div>
    <div class="hint">Ton espace se prépare. La première ouverture peut prendre quelques secondes.</div>
  </div>
  <noscript>
    <p style="font-family: sans-serif; text-align: center; padding: 24px;">
      Pour ouvrir INTELLIA 237, active JavaScript dans ton navigateur.
    </p>
  </noscript>

  <script>
    // Compatibilité avec flutter_native_splash, qui appelle cette fonction.
    function removeSplashFromWeb() {
      var loader = document.getElementById("intellia-loader");
      if (!loader) return;
      loader.classList.add("done");
      setTimeout(function () { loader.remove(); }, 400);
    }
    window.addEventListener("flutter-first-frame", removeSplashFromWeb);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
